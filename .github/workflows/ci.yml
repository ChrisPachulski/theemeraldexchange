name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (production-readiness re-review): every job here only
# checks out code and uploads workflow artifacts (artifact upload uses the
# Actions service, not the repo-scoped token) — none needs write access to
# contents, packages, PRs, or anything else. Raise per-job if a future job
# provably needs more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Bumped from 8 → 15: Playwright install adds ~45s (chromium-only,
    # cached browsers on subsequent runs) and the 7-spec suite runs
    # ~50s on GitHub-hosted runners.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (SPA)
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # vitest run --coverage runs the suite once (SPA + repo contracts) and
      # produces an HTML coverage report. No separate `npm test` step.
      - name: Test + coverage
        run: npm run test:coverage

      - name: Build (Vite)
        run: npm run build

      # Install only the Chromium browser + its OS deps. The
      # playwright.config.ts pins projects to chromium-only, so
      # downloading the full Firefox/WebKit binaries (~400 MB) on every
      # CI run would burn time and bandwidth for no coverage gain.
      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload SPA build
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  rust:
    # The Rust workspace: the gateway (the backend), auth, media-core, iptv,
    # transcoder, the recommender and emerald-contracts, the canonical
    # cross-language source of truth for token formats, HKDF derivations,
    # sub-namespace, PII scrub. The Apple Swift port MUST agree with it
    # byte-for-byte; tests/vectors/*.json are the interop oracle.
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, 2026-03-27; explicit `toolchain` input pins the actual compiler
        with:
          toolchain: '1.96'
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Format check first — fastest signal. Hard gate: run `cargo fmt --all`
      # before pushing. Output is tee'd (as are clippy and test below) so the
      # failure step can surface the offending file as an annotation — job
      # logs need a login, annotations are public.
      - name: cargo fmt --check
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt.log

      - name: cargo clippy
        # Gating (-D warnings): emerald-contracts is the canonical cross-language
        # crypto crate (token/JWE/HMAC/HKDF) where clippy catches real
        # soundness issues; an advisory lint never enforces that intent.
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --workspace -- -D warnings 2>&1 | tee clippy.log

      - name: cargo build
        run: cargo build --workspace --all-targets

      # Vector parity test gate — the Rust crates produce the bytes
      # tests/vectors/*.json pin (stream-token-canonical.json,
      # hkdf-parity.json, ...). If this fails, a wire-level format drifted
      # and the Apple port will silently break.
      - name: cargo test
        # The scanner's 100-file wall-clock guard asserts only when
        # EEX_PERF_ASSERT names a budget in seconds; the runner is a shared
        # 2-4 vCPU box, so it gets 3x the 5s reference bar (see scanner.rs).
        # Output is tee'd so the failure step below can surface test names as
        # annotations (job logs need a login; annotations are public).
        shell: bash
        env:
          EEX_PERF_ASSERT: '15'
        run: |
          set -o pipefail
          cargo test --workspace --all-targets 2>&1 | tee cargo-test.log

      - name: Surface fmt / clippy / test failures as annotations
        if: failure()
        # First 10 hits only: GitHub shows at most 10 error annotations per step.
        run: |
          # dtolnay/rust-toolchain exports CARGO_TERM_COLOR=always, so every line
          # starts with an ANSI escape — strip them or nothing matches.
          cat fmt.log clippy.log cargo-test.log 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -E "^Diff in |^error(\[E[0-9]+\])?: |^ +--> |^test .* FAILED|panicked at" \
            | head -10 | sed 's/^/::error::/' || true

  audit:
    # Dependency vulnerability gate (production-readiness MEDIUM #7/#23).
    # Runs npm audit and cargo audit so a known CVE in either layer blocks
    # the merge before it reaches main. This job also hosts the LICENSE gate
    # (deny.toml + license-checker) — it already has both toolchains, so no
    # duplicate setup. The license gate keeps GPL/AGPL out of the *linked*
    # dependency trees; the only deliberate copyleft (process-isolated ffmpeg)
    # is tracked separately in THIRD-PARTY-LICENSES.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, 2026-03-27; explicit `toolchain` input pins the actual compiler
        with:
          toolchain: '1.96'

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-

      - name: Install JS dependencies (for npm audit)
        run: npm ci

      - name: npm audit (moderate+)
        # Runtime-facing moderate advisories are release blockers too. Any
        # exception must be explicit, vulnerability-specific, and time-bounded.
        run: npm audit --audit-level=moderate --omit=dev

      # cargo-audit and cargo-deny were compiled from source on every run (the
      # cargo cache above holds crates, not binaries) — ~6 min of a job whose
      # actual audits take seconds. Install into a private root and cache the
      # binaries, keyed on the pinned versions.
      - name: Cache cargo-audit + cargo-deny binaries
        id: cargo-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo-tools/bin
          key: ${{ runner.os }}-cargo-tools-cargo-audit-0.22.2-cargo-deny-0.20.2

      - name: Install cargo-audit + cargo-deny (cache miss only)
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --root ~/.cargo-tools cargo-audit@0.22.2
          cargo install --locked --root ~/.cargo-tools cargo-deny@0.20.2

      - name: Put the cached tools on PATH
        run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"

      - name: cargo audit
        # RUSTSEC-2026-0367/0368/0369: zip 8.6's ZipArchive::extract /
        # ZipStreamReader::extract (SUID bits, symlink targets, permissions
        # through symlinks). zip arrives only through candle-core (^8.6, for
        # .npz/.pth reading), which never calls extract, and the recommender
        # loads model.safetensors only. Drop these once candle moves to zip >= 9.
        run: cargo audit --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369

      # ── License gate (deny.toml) ──────────────────────────────────────────
      # Keep GPL/AGPL out of the LINKED dependency trees. The only deliberate
      # copyleft in the product is the process-isolated ffmpeg binary, recorded
      # in THIRD-PARTY-LICENSES.md with a written source offer — never linked,
      # so it cannot contaminate first-party code. cargo-deny reads Cargo.lock
      # (no compile); license-checker scans the production JS tree.
      - name: cargo deny check licenses (Rust)
        run: cargo deny check licenses

      - name: license-checker (production JS tree, fail on GPL/AGPL)
        # Explicit SPDX ids (not bare "GPL") so LGPL/MPL permissive-copyleft
        # deps don't false-trip. The production tree is currently GPL/AGPL-free
        # (verified 2026-06-17); this keeps it that way.
        run: npx --yes license-checker --production --failOn 'GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later'

  docker-build:
    # Every other job runs on the host runner via npm/cargo — nothing
    # else builds the multi-stage Dockerfiles that actually ship. Validate
    # compose interpolation on every run and build the backend image so
    # image-build regressions are caught pre-deploy; the backend image is
    # also booted to /api/health before anything is pushed. On main the images
    # are also PUSHED to GHCR as :main and :sha-<commit>: scripts/deploy-nas.sh
    # pulls exactly the :sha- image CI tested, so the NAS never compiles (its
    # on-box compiles wedged it three times — see scripts/deploy-image.sh).
    # The heavy sidecar images build only on main to keep PR feedback fast.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate compose config
        # `docker compose config` resolves ${...} interpolation and validates the
        # schema. The compose file uses only plain ${VAR} (no ${VAR:?required}),
        # so unset vars default to empty with a warning — `-q` still exits 0.
        # Verified against the production compose file on the deploy host.
        run: docker compose config -q

      - name: Image-pin staleness guard (best-effort)
        # Flags compose image pins whose Docker Hub tag was last pushed >12
        # months ago (the cloudflared pin once sat ~18 months stale with
        # nothing watching it). Self-test first (offline parser assertions),
        # then the live check. The script treats network/Hub-API failures as
        # warnings (exit 0) so a registry blip can never fail CI — only a
        # CONFIRMED stale tag does.
        run: |
          node scripts/check-image-pin-staleness.mjs --self-test
          node scripts/check-image-pin-staleness.mjs docker-compose.yml

      - name: Stage eex-ytresolve placeholder
        # The Dockerfile COPYs bin/eex-ytresolve (the prebuilt Rust YouTube
        # resolver). Its repo is private, so CI can only ship an exec-fail stub
        # (the gateway falls back to yt-dlp). The owner deploy bind-mounts the
        # real binary over this path (docker-compose.yml backend volumes), so
        # the pushed image is still the production image.
        run: |
          mkdir -p bin
          printf '#!/bin/sh\nexit 1\n' > bin/eex-ytresolve
          chmod +x bin/eex-ytresolve

      - name: Image base + release id
        id: rel
        # EEX_RELEASE must be the same short sha deploy-nas.sh computes locally:
        # its post-deploy drift check compares /api/version against it.
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/theemeraldexchange" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image (loaded for the boot check)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            EEX_RELEASE=${{ steps.rel.outputs.short }}
          tags: |
            theemeraldexchange-backend:ci
            ${{ steps.rel.outputs.base }}-backend:main
            ${{ steps.rel.outputs.base }}-backend:${{ steps.rel.outputs.sha }}
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

      - name: Boot the backend image to /api/health
        # The production posture the owner deploy runs: NODE_ENV=production,
        # the four secrets, an allowed origin, no SPA. A boot-gate failure
        # (config, ffmpeg >= 6, server.db migrations) never reaches GHCR.
        run: |
          secret() { head -c 48 /dev/urandom | base64 | tr -d '\n'; }
          docker run -d --name backend -p 127.0.0.1:3001:3001 \
            -e SESSION_SECRET="$(secret)" \
            -e STREAM_TOKEN_SECRET="$(secret)" \
            -e DEVICE_TOKEN_SECRET="$(secret)" \
            -e INTERNAL_PRINCIPAL_SECRET="$(secret)" \
            -e ALLOWED_ORIGINS=https://example.invalid \
            theemeraldexchange-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/api/health && break || sleep 2
            [ "$i" = 30 ] && { docker logs backend; exit 1; }
          done
          curl -fsS http://127.0.0.1:3001/api/version | grep -q '"release":"${{ steps.rel.outputs.short }}"'
          # Node-free: the runtime image carries no node binary.
          ! docker exec backend sh -c 'command -v node'
          # The owner re-key CLI ships beside the gateway (DEPLOY.md section 9).
          docker exec backend test -x /usr/local/bin/eex-rekey
          docker rm -f backend

      - name: Push backend image (main only, after the boot check)
        if: env.PUSH == 'true'
        run: |
          docker push "${{ steps.rel.outputs.base }}-backend:main"
          docker push "${{ steps.rel.outputs.base }}-backend:${{ steps.rel.outputs.sha }}"

      - name: Build + push media-core image (main only)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./crates/media-core/Dockerfile
          push: true
          tags: |
            ${{ steps.rel.outputs.base }}-media-core:main
            ${{ steps.rel.outputs.base }}-media-core:${{ steps.rel.outputs.sha }}
          cache-from: type=gha,scope=ci-media-core
          cache-to: type=gha,mode=max,scope=ci-media-core

      - name: Build + push iptv image (main only)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./crates/iptv/Dockerfile
          push: true
          tags: |
            ${{ steps.rel.outputs.base }}-iptv:main
            ${{ steps.rel.outputs.base }}-iptv:${{ steps.rel.outputs.sha }}
          cache-from: type=gha,scope=ci-iptv
          cache-to: type=gha,mode=max,scope=ci-iptv

      - name: Build + push transcoder image (main only)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./crates/transcoder/Dockerfile
          push: true
          tags: |
            ${{ steps.rel.outputs.base }}-transcoder:main
            ${{ steps.rel.outputs.base }}-transcoder:${{ steps.rel.outputs.sha }}
          cache-from: type=gha,scope=ci-transcoder
          cache-to: type=gha,mode=max,scope=ci-transcoder

      - name: Build recommender image (main only; loaded for the checks below)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./crates/recommender/Dockerfile
          load: true
          tags: |
            theemeraldexchange-recommender:ci
            ${{ steps.rel.outputs.base }}-recommender:main
            ${{ steps.rel.outputs.base }}-recommender:${{ steps.rel.outputs.sha }}
          cache-from: type=gha,scope=ci-recommender
          cache-to: type=gha,mode=max,scope=ci-recommender

      - name: Verify recommender image (embedding + cold-volume boot)
        if: env.PUSH == 'true'
        run: scripts/ci-recommender-image-check.sh theemeraldexchange-recommender:ci

      - name: Push recommender image (main only, after the image checks)
        if: env.PUSH == 'true'
        run: |
          docker push "${{ steps.rel.outputs.base }}-recommender:main"
          docker push "${{ steps.rel.outputs.base }}-recommender:${{ steps.rel.outputs.sha }}"

  shellcheck:
    # The ~500-line deploy script (scripts/deploy-nas.sh) snapshots, rsyncs,
    # rolls back, and health-gates the production stack — exactly the kind of
    # shell where an unquoted variable or masked exit code ships an outage.
    # Nothing linted it before this job. shellcheck is preinstalled on
    # ubuntu-latest runner images (no apt/container needed).
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck scripts/*.sh
        # --severity=warning: gate on warnings+errors. Info-level findings are
        # dominated by SC2029 ("expands on the client side") on the ssh
        # one-liners — which is the deploy script's INTENT (local values like
        # $APPDATA/$ROLLBACK_TS are deliberately interpolated before the
        # remote shell runs), so info stays advisory.
        run: |
          shellcheck --version
          shellcheck --severity=warning scripts/*.sh

      - name: Guard canonical deploy against raw NAS builds
        run: |
          if grep -Ev '^[[:space:]]*#' scripts/deploy-nas.sh \
            | grep -Eq 'docker(-compose| compose).*(--build|[[:space:]]build([[:space:]]|$))|docker[[:space:]]+build([[:space:]]|$)'; then
            echo 'deploy-nas.sh must route every build through nas-safe-build.sh' >&2
            exit 1
          fi
