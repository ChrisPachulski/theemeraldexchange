# PR-time docker builds for the sidecar images.
#
# ci.yml's docker-build job builds and boots the backend image (the Rust
# gateway) on every run but the sidecars (recommender, media-core, transcoder,
# iptv) only on push to main — which meant a PR could break a sidecar
# Dockerfile and the failure surfaced only AFTER merge. This workflow closes
# that gap: it builds the sidecar images on PRs, runs the recommender's
# `eex-recommender verify-embedding` against the baked MiniLM files and boots
# it on a cold volume to /health, but only when the inputs that feed them
# change (path filter below), so routine SPA PRs stay fast. The backend Dockerfile shares the crates/ workspace, so a
# crates/ change rebuilds the sidecars here and the backend in ci.yml.
#
# The matrix fans the images out in parallel; per-image GHA cache
# scopes keep layer caches from clobbering each other.

name: sidecar-images

on:
  pull_request:
    paths:
      - "crates/**"
      - "scripts/ci-recommender-image-check.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/sidecar-images.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: the build job only checks out code and runs local
# (push: false) docker builds — GHA layer cache auth comes from the runtime's
# ACTIONS_RUNTIME_TOKEN, not this repo-scoped token. Nothing here writes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The Rust images compile the workspace from scratch on a cache miss —
    # generous cap.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: recommender
            dockerfile: ./crates/recommender/Dockerfile
          - name: media-core
            dockerfile: ./crates/media-core/Dockerfile
          - name: transcoder
            dockerfile: ./crates/transcoder/Dockerfile
          - name: iptv
            dockerfile: ./crates/iptv/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: ${{ matrix.name == 'recommender' }}
          tags: theemeraldexchange-${{ matrix.name }}:ci
          cache-from: type=gha,scope=sidecar-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=sidecar-${{ matrix.name }}

      - name: Verify recommender image (embedding + cold-volume boot)
        if: matrix.name == 'recommender'
        run: scripts/ci-recommender-image-check.sh theemeraldexchange-recommender:ci
