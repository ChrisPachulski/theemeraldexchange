[package]
name = "emerald-contracts-napi"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "N-API bindings for emerald-contracts. Built by napi-rs; consumed from Hono."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
emerald-contracts = { path = "../emerald-contracts" }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
memchr = "2.8.3"
napi = { version = "3.9", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3.5"
quick-xml = "0.42.0"
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
