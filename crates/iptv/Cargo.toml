[package]
name = "iptv"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The Emerald Exchange iptv service: sole owner of iptv.db and the only process that dials the Xtream provider (catalog sync, EPG, live TV, DVR)."
publish = false

[[bin]]
name = "iptv"
path = "src/main.rs"

[lib]
name = "iptv"
path = "src/lib.rs"

[dependencies]
# ssrf_guard, the schema_migrations migrator and verify_principal.
media-core = { path = "../media-core" }
# Stream tokens and internal principals.
emerald-contracts = { path = "../emerald-contracts" }
ulid.workspace = true
axum = { version = "0.8", features = ["json", "query", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
croner = "3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "rustls", "reqwest", "tracing"] }
sentry-tracing = "0.49"
# XMLTV parsing (src/xmltv.rs, also compiled into the napi addon until S8).
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
memchr = "2.8.3"
quick-xml = "0.42.0"
regex.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
sha2.workspace = true
