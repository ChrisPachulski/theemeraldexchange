[package]
name = "auth"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The Emerald Exchange auth library: owns the identity half of server.db (members, invites, device tokens, server_id). Linked in-process by the gateway; not a service of its own."
publish = false

[lib]
name = "auth"
path = "src/lib.rs"

[dependencies]
# The schema_migrations migrator.
media-core = { path = "../media-core" }
# Sub grammar, HKDF and the device-token JWE.
emerald-contracts = { path = "../emerald-contracts" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["json"] }
chrono = "0.4"
sha2.workspace = true
base64.workspace = true
rand.workspace = true
ulid.workspace = true
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
